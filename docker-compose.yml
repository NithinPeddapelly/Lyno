version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyno-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - lyno-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lyno-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lyno-net

networks:
  lyno-net:
    driver: bridge
